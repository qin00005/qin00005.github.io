<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>使用浏览器打开</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto;}
body{background:#ffffff;}
/* 顶部蓝渐变横幅，和截图样式匹配 */
.header{
    width:100%;
    height:190px;
    background:linear-gradient(135deg,#0097ee,#42c9ff);
    position:relative;
    overflow:hidden;
}
/* 右上角白色箭头，替换原来的手指 */
.arrow{
    position:absolute;
    right:30px;
    top:20px;
    width:70px;
    height:70px;
    color:#ffffff;
    font-size:70px;
    font-weight:bold;
}

.main{
    padding:36px 20px;
    text-align:center;
}
.tip-text{
    font-size:17px;
    color:#2266bb;
    line-height:2.2;
}
.desc-text{
    color:#666666;
    font-size:14px;
    margin:24px 0;
}
.copy-btn{
    padding:10px 32px;
    font-size:16px;
    border:1px solid #b8c8e2;
    background:#fff;
    color:#2266bb;
    border-radius:999px;
    cursor:pointer;
}
.toast{
    position:fixed;
    top:40%;
    left:50%;
    transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.65);
    color:#fff;
    padding:10px 18px;
    border-radius:6px;
    display:none;
}
</style>
</head>
<body>
<div class="header">
    <!-- 右上角白色箭头 -->
    <div class="arrow">↗</div>
</div>

<div class="main">
    <div class="tip-text">
        1.本站不支持 微信或QQ 内访问<br>
        2.请按提示在手机浏览器打开
    </div>
    <div class="desc-text">点击右上角 ⋯ or 复制网址自行打开</div>
    <br>
    <button class="copy-btn" id="copyBtn">点此复制本站网址</button>
</div>

<div class="toast" id="toast">复制成功，么么哒</div>

<script>
// 修改这里为你的目标外链
const targetUrl = "https://kefu365.top/#/?uid=eyg";
const copyBtn = document.getElementById('copyBtn');
const toast = document.getElementById('toast');

// 判断微信环境
function isWeChat(){
  return navigator.userAgent.toLowerCase().indexOf('micromessenger') !== -1;
}

copyBtn.onclick = function(){
  navigator.clipboard.writeText(targetUrl).then(()=>{
    toast.style.display = 'block';
    setTimeout(()=>toast.style.display = 'none',1800);
  })
}

// 非微信浏览器直接跳转
if(!isWeChat()){
  location.href = targetUrl;
}
</script>
</body>
</html>
