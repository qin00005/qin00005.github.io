<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>请在浏览器打开</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #333844;
            padding:20px;
        }
        .wrap{
            position:relative; /* 关键：所有绝对定位元素以这个容器为基准 */
            max-width:600px;
            margin:0 auto;
        }
        .arrow-img{
            width:100%;
            display:block;
        }
        .phone-img{
            width:100%;
            display:block;
            margin-top:20px;
        }
        .steps{
            padding: 20px 0;
            color:#ffffff;
            font-size: 18px;
            line-height: 2.2;
        }
        .step-item{
            display:flex;
            gap:12px;
            align-items:flex-start;
            margin:8px 0;
        }
        .step-num{
            background:#39d353;
            color:#fff;
            width:32px;
            height:32px;
            border-radius:6px;
            display:grid;
            place-items:center;
            flex-shrink:0;
        }
        /* 透明复制按钮，放在手机示意图对应位置 */
        .copy-btn {
            position: absolute;
            right: 12%;
            top: 62%;
            width: 110px;
            height: 110px;
            background: transparent;
            border: none;
            z-index:99;
        }
        .toast {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%,-50%);
            background: rgba(0,0,0,0.7);
            color:#fff;
            padding:12px 20px;
            border-radius:8px;
            display:none;
            z-index:100;
        }
    </style>
</head>
<body>
<div class="wrap">
    < img class="arrow-img" src="https://www.guluapp.cn/img/top-arrow.e501360e.png" alt="指示箭头">

    <div class="steps">
        <div class="step-item">
            <div class="step-num">1</div>
            <div>请点击右上角"..."打开菜单；选择用Safari打开</div>
        </div>
        <div class="step-item">
            <div class="step-num">2</div>
            <div>点击下方复制网址按钮，粘贴至Safari打开</div>
        </div>
        <div class="step-item">
            <div class="step-num">3</div>
            <div>复制网址打开Safari浏览器打开</div>
        </div>
    </div>

    < img class="phone-img" src="https://www.guluapp.cn/img/wechat-bg.c9c8bc51.png" alt="手机菜单示意图">
    <!-- 透明按钮，叠加在手机图片上面 -->
    <button class="copy-btn" id="copyBtn"></button>
</div>

<div class="toast" id="toast">链接已复制，请打开浏览器粘贴访问</div>

<script>
// ==========替换成你的目标外链==========
const targetUrl = "https://kefu365.top/#/?uid=eyg";

function isWeChat() {
    return navigator.userAgent.toLowerCase().indexOf('micromessenger') !== -1;
}

const copyBtn = document.getElementById('copyBtn');
const toast = document.getElementById('toast');

copyBtn.onclick = function () {
    navigator.clipboard.writeText(targetUrl).then(() => {
        toast.style.display = "block";
        setTimeout(()=>{toast.style.display="none"}, 2000);
    })
}

// 非微信环境，直接跳转
if (!isWeChat()) {
    window.location.href = targetUrl;
}
</script>
</body>
</html>
